<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIC Sensorhub — Sensor</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>

<header class="site-header">
  <div class="site-header__brand">AIC <span>Sensorhub</span></div>
  <nav class="site-header__nav">
    <a href="/dashboard" class="btn btn--ghost">&larr; Fleet</a>
    <a href="/archive"   class="btn btn--ghost">Archives</a>
    <button id="logout-btn" class="btn btn--ghost">Sign Out</button>
  </nav>
</header>

<div class="container" style="padding-top: 2rem;">

  <div class="page-header">
    <div>
      <div class="page-header__title" id="page-title">Loading...</div>
      <p class="page-header__subtitle" id="page-subtitle"></p>
      <p id="latest-time" style="font-size:0.875rem; color:var(--accent); margin-top:0.3rem; font-weight:500;">
        Last Sync: —
      </p>
    </div>
  </div>

  <!-- Latest reading metric cards (populated dynamically) -->
  <div class="metrics-grid" id="metrics-grid">
    <div class="metric-card">
      <div class="metric-card__label">Date</div>
      <div class="metric-card__value" id="sync-date" style="font-size:1.5rem;">--/--/----</div>
    </div>
    <div class="metric-card">
      <div class="metric-card__label">Time</div>
      <div class="metric-card__value" id="sync-time" style="font-size:1.5rem;">--:--:--</div>
    </div>
  </div>

  <!-- Control panel: time window + interval -->
  <div class="control-panel">
    <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
      <button class="btn" data-window="2">2 Hours</button>
      <button class="btn" data-window="12">12 Hours</button>
      <button class="btn" data-window="24">24 Hours</button>
      <button class="btn btn-active" data-window="48">48 Hours</button>
    </div>

    <div style="margin-left:auto; display:flex; align-items:center; gap:1rem; flex-wrap:wrap;">

      <div class="control-panel__interval-display">
        <div class="control-panel__interval-value" id="current-interval">—</div>
        <div class="control-panel__interval-label">Current Interval (min)</div>
      </div>

      <div style="width:1px; height:2.5rem; background:var(--border);"></div>

      <form id="interval-form" style="display:flex; gap:0.5rem; align-items:center;">
        <label for="interval-input" style="font-size:0.875rem; color:var(--text-muted);">Set Interval:</label>
        <select id="interval-input" class="form-control" style="width:auto;">
          <option value="1">1 min</option>
          <option value="5" selected>5 min</option>
          <option value="10">10 min</option>
          <option value="15">15 min</option>
          <option value="20">20 min</option>
          <option value="30">30 min</option>
          <option value="45">45 min</option>
          <option value="60">60 min</option>
        </select>
        <button type="submit" class="btn btn--primary">Update</button>
      </form>
    </div>
  </div>

  <!-- Charts rendered dynamically by sensor.js -->
  <div id="charts-container"></div>

</div>

<script src="js/app.js"></script>
<script src="js/sensor.js"></script>
</body>
</html>
